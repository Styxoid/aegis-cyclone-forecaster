# Google Cloud Build Pipeline for AegisSurge
# Deploys FastAPI Simulation Core to Google Cloud Run (asia-south1)
steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/aegissurge-core:$COMMIT_SHA', '.']

  # 2. Push Docker image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/aegissurge-core:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'aegissurge-core'
      - '--image'
      - 'gcr.io/$PROJECT_ID/aegissurge-core:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/aegissurge-core:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
